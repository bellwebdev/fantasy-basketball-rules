name: Deploy to homeserver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Rebuilds data/players.json from Sleeper so the deployed copy reflects
      # current rosters rather than whatever was committed.
      - name: Build trimmed player map
        run: node tools/build-players.mjs

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust homeserver host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync static files via rsync
        run: |
          rsync -avz --delete --omit-dir-times \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tools' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:"
